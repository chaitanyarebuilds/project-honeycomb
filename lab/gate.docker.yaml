# The gate as the lab runs it. Learning mode keeps first-time tool pinning automatic.
schema_version: 1
agent_id: lab-gate
mode: learning
state_dir: /state
alert_sink: /state/sink.jsonl
upstreams:
  crm:
    command: ["python", "/app/lab/targets/crm.py"]
    env: { HC_LAB_MARKER: /state/real_exports.log }
  wiki:
    command: ["python", "/app/lab/targets/wiki.py"]
  docs:
    command: ["python", "/app/lab/targets/docs.py"]
    env: { HC_LAB_DOCS: /data/docs }
agents:
  support-bot: { scopes: ["*"] }
defaults: { approval_wait_s: 3, approval_timeout_s: 12, approval_ttl_s: 120 }
rules:
  - id: approve-rotate
    match: { tool: "crm__rotate_keys" }
    action: approve
    quorum: 2
  - id: approve-disable
    match: { tool: "crm__disable_user" }
    action: approve
  - id: cap-exports
    match: { tool: "crm__export_report" }
    action: allow
    caps: { max_rows: 100, per_minute: 3 }
decoys:
  count: 1
  vocabulary: [export_all_customer_data]
  placement: crm
  on_trip: { response: tarpit, tarpit_delay_s: 1.0 }
notify: { email: false }
http:
  host: 0.0.0.0
  port: 8765
  allowed_hosts: ["gate:8765"]
egress:
  log: /egress/egress.jsonl
  sources: { 172.30.0.10: support-bot }
deployment:
  network_enforced: true

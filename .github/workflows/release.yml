name: Release build
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: docker build -t honeycomb-gate:${{ github.ref_name }} .
      - run: docker save honeycomb-gate:${{ github.ref_name }} -o honeycomb-gate-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/*
            honeycomb-gate-image.tar
